services:
  _defaults:
    autowire: true
    autoconfigure: true

  Atoolo\TranslationApi\Service\CatalogueExporter:
    arguments:
      $translator: '@translator'

  Atoolo\TranslationApi\Service\LocaleResolver:
    arguments:
      $locales: '%atoolo_translation_api.locales%'

  Atoolo\TranslationApi\Service\KeyNester: ~

  Atoolo\TranslationApi\Service\FullAccessChecker:
    arguments:
      $authorizationChecker: '@?security.authorization_checker'
      $roles: '%atoolo_translation_api.full_access_roles%'

  Atoolo\TranslationApi\Service\JsonResponseFactory:
    arguments:
      $cacheMaxAge: '%atoolo_translation_api.cache_max_age%'

  Atoolo\TranslationApi\Service\DomainLister:
    arguments:
      $translator: '@translator'

  Atoolo\TranslationApi\Service\ExposedDomains:
    arguments:
      $domains: '%atoolo_translation_api.domains%'

  Atoolo\TranslationApi\Controller\TranslationController:
    tags:
      - { name: controller.service_arguments }

  Atoolo\TranslationApi\Controller\TranslationDomainsController:
    tags:
      - { name: controller.service_arguments }
